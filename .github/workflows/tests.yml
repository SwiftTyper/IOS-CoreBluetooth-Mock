name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  swift-test:
    # The mock does not use Bluetooth hardware, so the tests of the library run on the Mac.
    name: swift test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
